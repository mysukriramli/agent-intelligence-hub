name: OmniWire Autonomous Multi-Domain Ingestion

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-omni-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute OmniWire Ingestion
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config user.name "omniwire-bot[bot]"
          git config user.email "omniwire-bot@users.noreply.github.com"
          git add -A data/ llms.txt
          
          if git diff --staged --quiet; then
            echo "No updates detected across any wire. Skipping commit."
          else
            git commit -m "chore(wire): auto-sync multi-domain telemetry [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
